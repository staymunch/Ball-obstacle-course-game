<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ball Roll">
<meta name="theme-color" content="#7cc4ff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ball Roll Adventure</title>
<style>
  :root {
    --purple: #8b5cf6;
    --purple-dark: #6d28d9;
    --gold: #fbbf24;
    --green: #22c55e;
    --green-dark: #15803d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #cfe8ff;
    font-family: "Avenir Next Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud button, .overlay { pointer-events: auto; }

  .top {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
  }
  .level-badge {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.85); padding: 6px 16px 6px 6px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
  }
  .level-num {
    background: var(--purple); color: #fff; font-weight: 800; font-size: 20px;
    min-width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    padding: 0 8px; box-shadow: inset 0 -4px 0 var(--purple-dark);
  }
  .progress { width: min(40vw, 320px); height: 16px; border-radius: 99px; background: #e9e3fb; overflow: hidden; }
  .progress > div { height: 100%; width: 0%; background: linear-gradient(90deg, #a78bfa, var(--purple)); border-radius: 99px; transition: width .2s linear; }

  .round-btn {
    position: absolute; width: 56px; height: 56px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.85); box-shadow: 0 3px 10px rgba(0,0,0,.15);
    font-size: 24px; color: #444; display: grid; place-items: center; cursor: pointer;
  }
  #pauseBtn { top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px); }
  #muteBtn { top: calc(env(safe-area-inset-top) + 76px); left: calc(env(safe-area-inset-left) + 12px); font-size: 22px; }
  .stars {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: calc(env(safe-area-inset-right) + 14px);
    background: rgba(255,255,255,.85); border-radius: 999px; padding: 8px 18px;
    font-weight: 800; font-size: 24px; color: #b7791f; box-shadow: 0 3px 10px rgba(0,0,0,.15);
  }

  .toast {
    position: absolute; top: 24%; left: 50%; transform: translate(-50%, 0) scale(.6);
    font-size: clamp(32px, 7vw, 64px); font-weight: 900; color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.18), 0 0 18px rgba(0,0,0,.15);
    -webkit-text-stroke: 2px rgba(80,40,160,.55);
    opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .hint {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 6%); left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; color: #fff; background: rgba(0,0,0,.25);
    padding: 10px 22px; border-radius: 999px; transition: opacity .5s; white-space: nowrap;
  }
  .hint .hand { display: inline-block; animation: swipe 1.4s ease-in-out infinite; }
  @keyframes swipe { 0%,100% { transform: translateX(-24px); } 50% { transform: translateX(24px); } }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(40, 20, 90, .35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .card {
    background: #fff; border-radius: 32px; padding: 32px 40px; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); min-width: min(420px, 88vw); max-width: 92vw;
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h1 { margin: 0 0 6px; font-size: clamp(34px, 6vw, 52px); color: var(--purple-dark); }
  .card p { margin: 6px 0 18px; font-size: 22px; color: #555; }
  .big-btn {
    display: block; width: 100%; margin: 14px 0 0; border: none; border-radius: 22px;
    font: inherit; font-size: 32px; font-weight: 900; color: #fff; padding: 18px 24px; cursor: pointer;
    background: var(--green); box-shadow: inset 0 -7px 0 var(--green-dark), 0 6px 14px rgba(0,0,0,.15);
  }
  .big-btn:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 var(--green-dark); }
  .big-btn.alt { background: var(--purple); box-shadow: inset 0 -7px 0 var(--purple-dark), 0 6px 14px rgba(0,0,0,.15); font-size: 24px; }
  .level-picker { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0 4px; }
  .level-picker button {
    width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 30px; font-weight: 900;
    background: #ede9fe; color: var(--purple-dark); cursor: pointer;
  }
  .level-picker button:disabled { opacity: .3; }
  .level-picker span { font-size: 30px; font-weight: 900; color: #333; min-width: 150px; }
  .result-stars { font-size: 44px; font-weight: 900; color: #b7791f; margin: 4px 0 8px; }
  .ball-emoji { font-size: 64px; line-height: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="top">
    <div class="level-badge">
      <div class="level-num" id="levelNum">1</div>
      <div class="progress"><div id="progressFill"></div></div>
    </div>
  </div>
  <button class="round-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
  <button class="round-btn" id="muteBtn" aria-label="Sound">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
  <div class="toast" id="toast"></div>
  <div class="hint" id="hint"><span class="hand">👆</span> Swipe up to roll, sideways to steer!</div>
</div>

<div class="overlay show" id="startScreen">
  <div class="card">
    <div class="ball-emoji">🟢</div>
    <h1>Ball Roll Adventure</h1>
    <div class="level-picker">
      <button id="lvlDown" aria-label="Previous level">−</button>
      <span id="lvlPick">Level 1</span>
      <button id="lvlUp" aria-label="Next level">+</button>
    </div>
    <button class="big-btn" id="playBtn">▶ Play</button>
  </div>
</div>

<div class="overlay" id="pauseScreen">
  <div class="card">
    <h1>Paused</h1>
    <button class="big-btn" id="resumeBtn">▶ Keep Going</button>
    <button class="big-btn alt" id="restartBtn">↺ Start Level Over</button>
    <button class="big-btn alt" id="menuBtn">☰ Pick a Level</button>
  </div>
</div>

<div class="overlay" id="winScreen">
  <div class="card">
    <h1 id="winTitle">Level 1 Done!</h1>
    <div class="result-stars" id="winStars">⭐ 0</div>
    <p id="winMsg">Great job!</p>
    <button class="big-btn" id="nextBtn">Next Level ▶</button>
    <button class="big-btn alt" id="againBtn">↺ Play Again</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
